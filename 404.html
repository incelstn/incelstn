<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #2563eb;
            --secondary-text: #555555;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111111;
                --text-color: #f5f5f5;
                --accent-color: #60a5fa;
                --secondary-text: #a3a3a3;
                --border-color: #333333;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        p {
            margin-bottom: 1.5rem;
            color: var(--secondary-text);
        }

        .button {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background-color: var(--accent-color);
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: opacity 0.2s ease;
            width: fit-content;
        }

        .button:hover {
            opacity: 0.85;
            text-decoration: none;
        }

        footer {
            margin-top: 4rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--secondary-text);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <main>
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>
                idk where this page went, but it's not here nya~
            </p>
            <a href="/" class="button">Go Back Home</a>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Incelstn. Built with simplicity in mind.</p>
    </footer>
</body>
</html>
